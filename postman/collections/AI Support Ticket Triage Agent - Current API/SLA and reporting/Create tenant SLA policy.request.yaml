$kind: http-request
url: http://{{baseHost}}:{{basePort}}/api/v1/sla-policies
method: POST
headers:
  X-Organisation-ID: "{{organisationId}}"
  Content-Type: application/json
body:
  type: json
  content: '{"description":"Tenant-configured test SLA","effectiveFrom":"2026-01-01T00:00:00.000Z","effectiveTo":null,"payload":{"calendar":{"timeZone":"Africa/Johannesburg","weeklySchedule":{"monday":[{"startMinute":540,"endMinute":1020}],"tuesday":[{"startMinute":540,"endMinute":1020}],"wednesday":[{"startMinute":540,"endMinute":1020}],"thursday":[{"startMinute":540,"endMinute":1020}],"friday":[{"startMinute":540,"endMinute":1020}]},"holidays":[]},"targetsByPriority":{"high":{"firstResponseMinutes":60,"resolutionMinutes":240},"normal":{"firstResponseMinutes":240,"resolutionMinutes":1440}},"pausedStatuses":["PENDING"],"resolvedStatuses":["RESOLVED","CLOSED"],"riskAtPercent":75}}'
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: if (pm.response.code === 201) { const result = pm.response.json(); pm.collectionVariables.set('slaPolicyId', result.data.policy.id); pm.collectionVariables.set('slaVersionId', result.data.version.id); }
    language: text/javascript
order: 2000
