$kind: http-request
url: http://{{baseHost}}:{{basePort}}/api/v1/tickets/{{ticketId}}/reopen-requests/{{reopenRequestId}}/approve
method: POST
headers:
  X-Organisation-ID: "{{organisationId}}"
  Content-Type: application/json
body:
  type: json
  content: "{}"
auth:
  type: bearer
  credentials:
    token: "{{supervisorToken}}"
order: 7000
