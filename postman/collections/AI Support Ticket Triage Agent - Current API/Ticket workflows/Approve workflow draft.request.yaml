$kind: http-request
url: http://{{baseHost}}:{{basePort}}/api/v1/ticket-workflows/{{workflowId}}/approve
method: POST
headers:
  X-Organisation-ID: "{{organisationId}}"
  Content-Type: application/json
body:
  type: json
  content: "{}"
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
order: 4000
