$kind: http-request
url: http://{{baseHost}}:{{basePort}}/api/v1/departments
method: POST
headers:
  X-Organisation-ID: "{{organisationId}}"
  Content-Type: application/json
body:
  type: json
  content: '{"name":"Support"}'
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: if (pm.response.code === 201) { const result = pm.response.json(); pm.collectionVariables.set('departmentId', result.data.id); }
    language: text/javascript
order: 10000
