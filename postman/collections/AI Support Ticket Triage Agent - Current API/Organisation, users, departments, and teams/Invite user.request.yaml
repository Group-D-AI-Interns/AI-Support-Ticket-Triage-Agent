$kind: http-request
url: http://{{baseHost}}:{{basePort}}/api/v1/users
method: POST
headers:
  X-Organisation-ID: "{{organisationId}}"
  Content-Type: application/json
body:
  type: json
  content: '{"email":"new.user@example.test","displayName":"New Test User","roles":["requester"]}'
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: if (pm.response.code === 201) { const result = pm.response.json(); pm.collectionVariables.set('userId', result.data.user.id); }
    language: text/javascript
order: 5000
