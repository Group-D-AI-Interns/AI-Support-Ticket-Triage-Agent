$kind: http-request
url: http://{{baseHost}}:{{basePort}}/api/v1/documents/{{documentId}}/download-token
method: POST
headers:
  X-Organisation-ID: "{{organisationId}}"
  Content-Type: application/json
body:
  type: json
  content: "{}"
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: afterResponse
    code: if (pm.response.code === 201) { const result = pm.response.json(); pm.collectionVariables.set('documentDownloadToken', result.data.token); }
    language: text/javascript
order: 5000
